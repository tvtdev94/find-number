name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Build web
        run: pnpm --filter @find-number/web build

      - name: Build worker (dry-run)
        run: pnpm --filter @find-number/worker build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm --filter @find-number/worker exec wrangler d1 migrations apply find-number-db --local

      - name: Start servers + run E2E
        run: |
          set -e
          pnpm --filter @find-number/worker dev > /tmp/worker.log 2>&1 &
          WORKER_PID=$!
          pnpm --filter @find-number/web dev > /tmp/web.log 2>&1 &
          WEB_PID=$!
          npx -y wait-on http://127.0.0.1:8787/health http://127.0.0.1:5173 -t 60000
          pnpm exec playwright test --workers=1
          STATUS=$?
          kill $WORKER_PID $WEB_PID || true
          exit $STATUS

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            /tmp/worker.log
            /tmp/web.log
          retention-days: 3

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Apply D1 migrations (remote)
        run: pnpm --filter @find-number/worker exec wrangler d1 migrations apply find-number-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: pnpm --filter @find-number/worker exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build web (with prod API base)
        run: pnpm --filter @find-number/web build
        env:
          VITE_API_BASE: https://find-number-worker.tvtdev94.workers.dev

      - name: Deploy Pages
        run: pnpm --filter @find-number/worker exec wrangler pages deploy ../web/dist --project-name=find-number --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
